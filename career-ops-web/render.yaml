services:
  - type: web
    name: career-ops-web
    env: static
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    rootDir: career-ops-web
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
